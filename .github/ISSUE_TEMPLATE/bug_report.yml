name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please remove passwords, tokens, customer data and other
        secrets from anything you paste below. Security problems belong in a private advisory, not here.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of the `--version` flag or the installed package version.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and runtime version (for example Ubuntu 24.04, Python 3.12).
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the exact command or code you ran and the full output or traceback.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal input file or snippet that shows the problem helps a lot.
      placeholder: |
        1. ...
        2. ...
        3. ...
